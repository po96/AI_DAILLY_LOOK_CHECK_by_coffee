<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>분석 중...</title>

  <!-- 동일한 폰트 유지 -->
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f2027, #0b0f1a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(20, 30, 50, 0.85);
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #b8c4d6;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    /* ===== 로딩 애니메이션 ===== */
    .loader {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid rgba(56, 189, 248, 0.25);
      border-top-color: #38bdf8;
      margin: 0 auto 26px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== 진행 문구 ===== */
    .steps {
      text-align: left;
      font-size: 14px;
      color: #d6e6ff;
    }

    .step {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    .step.active {
      opacity: 1;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      margin-right: 10px;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #8fa3c8;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="title">AI 분석 중</div>
    <div class="subtitle">
      의상을 중심으로<br>
      헤어 & 메이크업을 분석하고 있습니다
    </div>

    <div class="loader"></div>

    <div class="steps">
      <div class="step active" id="step1">
        <div class="dot"></div>
        이미지 인식
      </div>
      <div class="step" id="step2">
        <div class="dot"></div>
        의상 스타일 분석
      </div>
      <div class="step" id="step3">
        <div class="dot"></div>
        헤어 & 메이크업 평가
      </div>
      <div class="step" id="step4">
        <div class="dot"></div>
        결과 정리
      </div>
    </div>

    <div class="footer">
      잠시만 기다려 주세요 (약 5~10초)
    </div>
  </div>

  <script>
    async function startAnalysis() {
      const imageBase64 = sessionStorage.getItem("imageBase64");

      if (!imageBase64) {
        alert("이미지가 없습니다. 처음 화면으로 돌아갑니다.");
        window.location.href = "index.html";
        return;
      }

      try {
        // 단계 표시용 애니메이션
        setTimeout(() => document.getElementById("step2").classList.add("active"), 800);
        setTimeout(() => document.getElementById("step3").classList.add("active"), 1600);
        setTimeout(() => document.getElementById("step4").classList.add("active"), 2400);

        // 실제 API 호출
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            image: imageBase64
          })
        });

        if (!response.ok) {
          throw new Error("분석 실패");
        }

        const result = await response.json();

        // 결과 저장
        sessionStorage.setItem("analysisResult", JSON.stringify(result));

        // 결과 페이지 이동
        window.location.href = "result.html";

      } catch (error) {
        alert("분석 중 오류가 발생했습니다.");
        console.error(error);
        window.location.href = "index.html";
      }
    }

    // 페이지 로드 시 자동 실행
    startAnalysis();
  </script>

</body>
</html>
