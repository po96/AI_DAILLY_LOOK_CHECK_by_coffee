<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Look Critic by coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
    /* ===== 기본 리셋 및 배경 ===== */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Pretendard', sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f2027, #0b0f1a);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #ffffff;
    }

    /* ===== 메인 카드 ===== */
    .container {
      width: 100%; max-width: 420px;
      background: rgba(20, 30, 50, 0.85);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .title { font-size: 26px; font-weight: 700; margin-bottom: 10px; color: #fff; }
    .subtitle { font-size: 14px; color: #b8c4d6; margin-bottom: 28px; line-height: 1.5; }

    /* ===== 업로드 영역 ===== */
    .upload-area {
        background: #1e293b;
        border: 2px dashed #3da9fc;
        border-radius: 14px;
        transition: 0.3s;
        overflow: hidden;
    }
    .upload-area:hover { background: rgba(61,169,252,0.08); }

    /* ===== 버튼 ===== */
    .analyze-btn {
      width: 100%; margin-top: 24px; padding: 16px; border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #3da9fc, #00f2fe);
      color: #0b0f1a; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: 0.2s;
    }
    .analyze-btn:disabled { background: #555; cursor: not-allowed; color: #ccc; }
    .analyze-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(61,169,252,0.4);
    }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">AI 스타일 평가</div>
        <div class="subtitle">
          의상을 중심으로<br>
          헤어 & 메이크업을 함께 분석합니다
        </div>

        <div id="image-display" class="upload-area mb-6">
            <div class="py-12 flex flex-col items-center justify-center cursor-pointer" onclick="document.getElementById('file-input').click()">
                <span class="text-6xl mb-4">📸</span>
                <p class="text-lg text-slate-300 font-bold">사진을 클릭하여 업로드</p>
            </div>
        </div>

        <input type="file" id="file-input" class="hidden" accept="image/*" onchange="previewImage(this)">

        <button id="analyze-btn" class="analyze-btn" onclick="handleAnalysis()">
            사진 분석 시작하기
        </button>
        
        <footer class="mt-8 text-gray-400 text-xs">
            <p>AI 기반 스타일 분석 · 사진은 저장되지 않습니다</p>
        </footer>
    </div>

    <script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Canvas를 이용한 이미지 압축
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 최대 너비를 800px로 설정 (용량 최적화)
                const maxWidth = 800;
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = (maxWidth * height) / width;
                    width = maxWidth;
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // 압축된 Base64 데이터 생성 (품질 0.7)
                const compressedData = canvas.toDataURL('image/jpeg', 0.7);

                const display = document.getElementById('image-display');
                display.innerHTML = `<img id="uploaded-img" src="${compressedData}" class="w-full h-auto max-h-80 object-contain">`;
                
                // 압축된 데이터를 저장 (용량 초과 에러 방지)
                try {
                    localStorage.setItem('tempImage', compressedData);
                } catch (e) {
                    alert("이미지 용량이 너무 커서 저장에 실패했습니다. 다른 사진을 선택해주세요.");
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function handleAnalysis() {
    const btn = document.getElementById('analyze-btn');
    const imageData = localStorage.getItem('tempImage');

    if (!imageData) {
        alert("먼저 사진을 업로드해주세요!");
        return;
    }

    btn.disabled = true;
    btn.innerText = "분석 준비 중...";
    window.location.href = 'result.html';
}
    </script>
</body>
</html>
