<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 결과 - AI Look Critic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f2027, #0b0f1a);
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; padding: 20px;
        }
        .container {
            width: 100%; max-width: 420px;
            background: rgba(20, 30, 50, 0.95);
            border-radius: 18px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(61, 169, 252, 0.2);
            border-top: 5px solid #3da9fc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 결과 카드 스타일 */
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 18px; margin-top: 15px;
            border-left: 4px solid #3da9fc;
            text-align: left;
        }
        .label { color: #3da9fc; font-weight: 700; font-size: 15px; margin-bottom: 8px; display: block; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="loading-section" class="flex flex-col items-center py-10">
            <div class="spinner mb-6"></div>
            <div class="pulse text-xl font-bold text-[#3da9fc] mb-2">스타일 분석 중...</div>
            <div id="info-msg" class="text-gray-400 text-sm text-center px-4">이미지의 구도를 파악하고 있습니다.</div>
        </div>

        <div id="result-section" class="hidden">
            <div class="flex justify-center mb-6">
                <div class="relative flex items-center justify-center">
                    <svg class="w-32 h-32 transform -rotate-90">
                        <circle cx="64" cy="64" r="58" stroke="rgba(61, 169, 252, 0.1)" stroke-width="8" fill="transparent" />
                        <circle id="score-circle" cx="64" cy="64" r="58" stroke="#3da9fc" stroke-width="8" fill="transparent" 
                            stroke-dasharray="364.4" stroke-dashoffset="364.4" stroke-linecap="round"
                            style="transition: stroke-dashoffset 1.5s ease-out;" />
                    </svg>
                    <div class="absolute text-center">
                        <span id="score-display" class="text-3xl font-extrabold text-[#3da9fc]">0</span>
                        <span class="text-sm text-[#3da9fc]">점</span>
                    </div>
                </div>
            </div>

            <img id="result-img" class="w-full rounded-xl mb-6 shadow-lg border border-gray-700">
            
            <div id="analysis-content"></div>

            <div class="flex gap-3 mt-8">
                <button onclick="copyLink()" class="flex-1 py-3 border border-[#3da9fc] text-[#3da9fc] rounded-xl font-bold hover:bg-[#3da9fc]/10 transition-all text-sm">
                    🔗 링크 복사
                </button>
                <button onclick="location.href='index.html'" class="flex-1 py-3 bg-[#3da9fc] text-[#0b0f1a] rounded-xl font-bold hover:shadow-[0_0_15px_rgba(61,169,252,0.4)] transition-all text-sm">
                    🔄 다시하기
                </button>
            </div>

            <details class="mt-8 pt-4 border-t border-gray-800 cursor-pointer">
                <summary class="text-[10px] text-gray-600">Raw Data</summary>
                <div id="raw-text-content" class="mt-2 p-3 bg-black/30 rounded text-[10px] text-gray-500 whitespace-pre-wrap text-left"></div>
            </details>
        </div>
    </div>

    <script>
        const infoMessages = [
            "상의와 하의의 핏을 대조하고 있어요.",
            "전체적인 컬러 밸런스를 확인 중입니다.",
            "현재 스타일에 맞는 조언을 준비 중입니다."
        ];

        window.onload = async () => {
            const imageData = localStorage.getItem('tempImage');
            const resultImg = document.getElementById('result-img');

            if (!imageData || !resultImg) {
                alert("데이터가 없습니다. 다시 시작해주세요.");
                location.href = 'index.html';
                return;
            }

            resultImg.src = imageData;

            let i = 0;
            const msgTimer = setInterval(() => {
                const msgEl = document.getElementById('info-msg');
                if(msgEl) msgEl.innerText = infoMessages[i % infoMessages.length];
                i++;
            }, 2000);

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();
                clearInterval(msgTimer);
                displayResult(data.analysis);
            } catch (error) {
                clearInterval(msgTimer);
                alert("분석 실패!");
                location.href = 'index.html';
            }
        };

        function displayResult(text) {
            document.getElementById('loading-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            document.getElementById('raw-text-content').innerText = text;

            const contentArea = document.getElementById('analysis-content');
            // '점수:', '분석:', '강점:', '개선점:' 등을 기준으로 나눔
            const sections = text.split(/(?=점수:|분석:|강점:|약점:|개선점:)/g);
            
            let html = "";
            sections.forEach(section => {
                const trimmed = section.trim();
                if (trimmed.startsWith("점수:")) {
                    const score = (trimmed.match(/\d+(\.\d+)?/) || [0])[0];
                    document.getElementById('score-display').innerText = score;
                    const circle = document.getElementById('score-circle');
                    if(circle) circle.style.strokeDashoffset = 364.4 - (364.4 * score / 100);
                } else if (trimmed.includes(":")) {
                    const [title, ...contentArr] = trimmed.split(":");
                    const content = contentArr.join(":").trim()
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                    
                    html += `<div class="result-card"><span class="label">${title}</span><div class="text-sm text-gray-200 leading-relaxed">${content}</div></div>`;
                }
            });
            contentArea.innerHTML = html;
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("링크가 복사되었습니다!"));
        }
    </script>
</body>
</html>
