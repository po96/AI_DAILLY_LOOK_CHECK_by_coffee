<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 결과 - AI Look Critic</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f2027, #0b0f1a);
            display: flex; justify-content: center; align-items: center;
            color: #ffffff; padding: 20px;
        }
        .container {
            width: 100%; max-width: 420px;
            background: rgba(20, 30, 50, 0.95);
            border-radius: 18px; padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* 로딩 애니메이션 */
        .pulse { animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation {
            0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(61, 169, 252, 0.2);
            border-top: 5px solid #3da9fc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 결과 스타일 */
        .score-badge {
            background: linear-gradient(135deg, #3da9fc, #00f2fe);
            color: #0b0f1a;
            padding: 10px 20px; border-radius: 50px;
            font-weight: 800; font-size: 24px;
            display: inline-block; margin-bottom: 20px;
        }
        .result-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 15px; margin-top: 15px;
            border-left: 4px solid #3da9fc;
        }
        .label { color: #3da9fc; font-weight: 700; font-size: 14px; margin-bottom: 5px; display: block; }
        .back-btn {
            width: 100%; margin-top: 25px; padding: 12px;
            background: transparent; border: 1px solid #3da9fc;
            color: #3da9fc; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <div id="loading-section" class="flex flex-col items-center py-10">
            <div class="spinner mb-6"></div>
            <div class="pulse text-xl font-bold text-[#3da9fc] mb-2">스타일 분석 중...</div>
            <div id="info-msg" class="text-gray-400 text-sm text-center px-4">이미지의 구도를 파악하고 있습니다.</div>
        </div>

        <div id="result-section" class="hidden">
            <div class="text-center">
                <div id="score-display" class="score-badge">0점</div>
                <img id="result-img" class="w-full rounded-xl mb-6 shadow-lg border border-gray-700">
            </div>
            
            <div id="analysis-content">
                </div>
			<!--전체원문추가-->
			<div id="raw-report-section" class="mt-8 pt-6 border-t border-gray-700">
				<details class="cursor-pointer">
					<summary class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
						전체 분석 원문 데이터 보기 (모니터링용)
					</summary>
					<div id="raw-text-content" class="mt-4 p-4 bg-black/30 rounded-lg text-xs text-gray-400 leading-relaxed overflow-x-auto whitespace-pre-wrap text-left">
						</div>
				</details>
			</div>
			
        <div class="flex gap-3 mt-8">
			<button onclick="copyLink()" class="flex-1 py-3 border border-[#3da9fc] text-[#3da9fc] rounded-xl font-bold hover:bg-[#3da9fc]/10 transition-all">
				🔗 링크 복사
			</button>
		</div>
		<div class="flex gap-3 mt-8">
			<button onclick="location.href='index.html'" class="flex-1 py-3 bg-[#3da9fc] text-[#0b0f1a] rounded-xl font-bold hover:shadow-[0_0_15px_rgba(61,169,252,0.4)] transition-all">
				🔄 다시하기
			</button>
        </div>
        </div>
    </div>

    <script>
        const infoMessages = [
            "상의와 하의의 핏을 대조하고 있어요.",
            "전체적인 컬러 밸런스를 확인 중입니다.",
            "일상복으로서의 자연스러움을 체크하고 있어요.",
            "더 나은 코디를 위한 팁을 정리하고 있습니다.",
            "헤어와 메이크업의 조화를 가볍게 살펴보고 있어요."
        ];

        window.onload = async () => {
            const imageData = localStorage.getItem('tempImage');
            if (!imageData) {
                alert("이미지가 없습니다. 다시 시작해주세요.");
                location.href = 'index.html';
                return;
            }

            document.getElementById('result-img').src = imageData;

            // 로딩 메시지 변경 타이머
            let i = 0;
            const msgTimer = setInterval(() => {
                document.getElementById('info-msg').innerText = infoMessages[i % infoMessages.length];
                i++;
            }, 2000);

            try {
                // 실제 API 호출 (Vercel 배포 후 작동)
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });

                const data = await response.json();
                clearInterval(msgTimer);
                displayResult(data.analysis);

            } catch (error) {
                clearInterval(msgTimer);
                alert("분석 중 오류가 발생했습니다.");
                location.href = 'index.html';
            }
        };


		function displayResult(text) {
			document.getElementById('loading-section').classList.add('hidden');
			document.getElementById('result-section').classList.remove('hidden');
			document.getElementById('raw-text-content').innerText = text;

			const contentArea = document.getElementById('analysis-content');
			
			// 1. 큰 항목(분석, 강점, 약점/개선점) 단위로 먼저 나눕니다.
			// 보통 AI는 '항목:'으로 시작하므로 이를 기준으로 split 합니다.
			const sections = text.split(/(?=점수:|분석:|강점:|약점:|개선점:)/g);
			
			let html = "";
			
			sections.forEach(section => {
				const trimmed = section.trim();
				if (!trimmed) return;

				if (trimmed.startsWith("점수:")) {
					const scoreMatch = trimmed.match(/\d+(\.\d+)?/);
					const score = scoreMatch ? scoreMatch[0] : "0";
					document.getElementById('score-display').innerText = score + "점";
				} 
				else {
					const splitIdx = trimmed.indexOf(":");
					if (splitIdx !== -1) {
						const title = trimmed.substring(0, splitIdx).trim();
						let content = trimmed.substring(splitIdx + 1).trim();

						// 마크다운 형태의 강조(**)나 불렛 포인트(-)를 HTML로 간단히 치환
						content = content
							.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // 굵게
							.replace(/\n-/g, '<br>•') // 불렛 포인트
							.replace(/\n\d+\./g, '<br><strong>$&</strong>') // 숫자 목록
							.replace(/\n/g, '<br>'); // 줄바꿈 유지

						html += `
							<div class="result-card" style="margin-bottom: 20px;">
								<span class="label" style="font-size: 16px; margin-bottom: 10px;">${title}</span>
								<div class="text-gray-200 text-sm leading-relaxed">${content}</div>
							</div>
						`;
					}
				}
			});
			
			contentArea.innerHTML = html;
		}

    </script>
</body>
</html>
