<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="loading">코디 분석 중...</div>
        
        <div id="content" style="display:none;">
            <div class="image-box">
                <img id="preview">
            </div>

            <div class="score-box">
                <div id="scoreValue" class="score-text">0점</div>
            </div>

            <div id="analysisResult"></div>
        </div>
    </div>
<div id="loading">
    <div class="loading-spinner"></div>
    <div class="pulsing-text">AI 패션 전문가가 분석 중입니다...</div>
    <div id="infoMessage" class="info-message">이미지의 핏을 분석하고 있어요.</div>
</div>
    <script>

    // 로딩 중 보여줄 랜덤 메시지들
    const messages = [
        "상의와 하의의 실루엣을 비교하고 있어요.",
        "전체적인 색상 조화를 체크하는 중입니다.",
        "디테일한 액세서리 포인트를 분석하고 있어요.",
        "현재 스타일에 맞는 최적의 조언을 준비 중입니다.",
        "헤어보다는 옷의 핏에 더 집중하고 있어요."
    ];

    window.onload = async () => {
        const imageData = localStorage.getItem('tempImage');
        document.getElementById('preview').src = imageData;

        // 메시지 변경 타이머 시작
        let msgIndex = 0;
        const msgInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            document.getElementById('infoMessage').innerText = messages[msgIndex];
        }, 2000);

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });

            const data = await response.json();
            
            // 데이터 수신 후 타이머 중지 및 결과 렌더링
            clearInterval(msgInterval);
            renderResult(data.analysis);
        } catch (error) {
            clearInterval(msgInterval);
            alert("분석 실패! 다시 시도해주세요.");
        }
    };

	function renderResult(text) {
		document.getElementById('loading').style.display = 'none';
		document.getElementById('content').style.display = 'block';

		// GPT-4o mini의 응답을 줄 단위로 쪼개어 HTML 생성
		const sections = text.split('\n').filter(line => line.trim() !== "");
		let html = "";

		sections.forEach(line => {
			if (line.includes("점수:")) {
				document.getElementById('scoreValue').innerText = line.replace("점수:", "").trim();
			} else if (line.includes("분석:") || line.includes("강점:") || line.includes("약점:")) {
				const title = line.split(':')[0];
				const content = line.split(':')[1];
				html += `<div class="section">
							<span class="section-title">${title}</span>
							<p class="section-content">${content}</p>
						 </div>`;
			}
		});
		document.getElementById('analysisResult').innerHTML = html;
	}
    
</script>

</body>
